<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a {
            width: 1400px;
            height: 700px;
            border: 5px solid brown;
            margin-left: 50px;
            margin-top: 35px;
            display: flex;
        }

        .b {
            width: 300px;
            height: 500px;
            background: burlywood;
            margin-top: 100px;
            margin-left: 30px;
            box-shadow: 10px 10px 20px yellow;
        }

        .c {
            width: 300px;
            height: 500px;
            background: burlywood;
            margin-top: 100px;
            margin-left: 50px;
             box-shadow: 10px 10px 20px 10px  yellow;
        }

        .d {
            width: 300px;
            height: 500px;
            background: burlywood;
            margin-top: 100px;
            margin-left: 50px;
            box-shadow: inset -10px -10px 20px yellow;
        }

        .e {
            width: 300px;
            height: 500px;
            background: burlywood;
            margin-top: 100px;
            margin-left: 50px;
            box-shadow: inset 10px 20px 30px yellow , 10px 10px 20px orange;
        }
        .aa{
            text-shadow: 10px 10px 10px red;
        }
    </style>
</head>

<body>
    <div class="a">
        <h1 class="aa">Dhananjay Singh Rajawat</h1>
        <section class="b"></section>
        <section class="c"></section>
        <section class="d"></section>
        <section class="e"></section>
        
    </div>
</body>

</html>
