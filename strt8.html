<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
    margin-left: 15px;
        }
        span{
            font-size: 20px;
        }
        .aa{
            width: 70%;
            height: 700px;
           justify-self: center;
           margin-top: 70px;
          border: 3px solid brown;
           
        }
        .a{
            margin-left: 13px;
            font-size: 20px;

        }
        .b{
            font-size: 20px;
            margin-left: 440px;
        }
        .c{
        margin-left: 13px;
    height: 25px;
    width: 500px;;
        }
        .d{
           margin-left: 20px;
            height: 25px;
    width: 500px;
        }
        .e{
             margin-left: 13px;
           margin-top: 100px;
            font-size: 20px;

        }
        .f{
            font-size: 20px;
            margin-left: 440px;
            margin-top: 50px;
       
        }
    </style>
</head>

<body>
    <div class="aa">
    <h1>Job Application <span>(Web)</span></h1><br>
    <label class="a">First Name</label>
    <label class="b">Last Name</label><br>
    <input type="text" placeholder="Enter First Name..." class="c">
    <input type="text" placeholder="Enter Last Name..." class="d"><br>
    <label class="e">Email</label>
    <label class="f">Job Role</label><br>
    <input class="g" type="email" placeholder="Enter Email">
    <select class="h" >
        <option>Select Job Role</option>
        <option>Developer</option>
        <option>Systems Analyst</option>
        <option>Network Technician</option>
        <option>Cloud Engineer</option>
        <option>Database Administrator</option>
        <option>Tech Intern</option>
    </select><br>
    <label>Address</label><br>
    <textarea placeholder="Enter Address"></textarea><br>
    <label>City</label>
    <label>Pincode</label><br>
    <input type="text" placeholder="Enter City Name...">
    <input type="number" placeholder="Enter Pincode Name..."><br>
    <label>Date</label>
    <label>Upload Your CV</label><br>
    <input type="date">
    <input type="file"><br>
    <button>Apply Now</button>
    </div>
</body>

</html>
