<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div style="height: 10vh ; width: 100%;padding: 10px;">
        <div style="text-align: start;">
            <p>
            <h1>Register your Bank Account </h1>
            </p>
            <p>
            <h4> Start customizing your bank account registration from today. Collect all necessary details online and
                ensure a secure and efficient process. </h4>
            </p>
        </div>
        <div style="padding: 10px;">
            <label for="text ">Applicant Name*</label><br>
           <div style="display: flex; width: 100%;"> 
            <div style="width: 50% ; margin: 5px;">
                 <input type="text" style="height: 5vh; width: 100%;"></div>
                <div style="width: 50% ; margin: 5px;">
                    <input type="text" style="height: 5vh; width: 100%;">
                </div>
            </div>
            <label for="text">Email Address*</label><br>
            <input type="text" style="height: 5vh; width: 100%;"><br>
            <label for="number"> Phone Number</label><br>
            <input type="number" style="height: 5vh; width: 100%;">
            <label for="text"> Citizenship</label><br>

            <label for="text">Marital Status </label><br>
            <input type="text" style="height: 5vh; width: 100%;"><br>
            <label for="file">Supporting Documents</label><br>
            <input type="file" style="height: 5vh; width: 100%;"><br>
            <p>
            <h5>Max. file size: 10MB</h5>
            </p><br>


        </div>
        <div style="text-align: center;">


            <button style="height: 5vh ; width: 80%;color: white; background-color: blue;">
                Submit
            </button>
        </div>

    </div>
