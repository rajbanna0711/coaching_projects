<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            width: 300px;
            height: 200px;
            background-color: aqua;
            color: black;
            margin-left: 600px;
            margin-top: 300px
        }
        button:hover{
            background-color: red;
            color: white;
            border: none;
            font-size: 70px;
            transition: 2.5s;
            transform: scale(0.5);
            border-radius: 60px;
            box-shadow: 10px 10px 10px blue;
            text-shadow: 10px 10px 10px yellow;
           
        }
        .a{
            width: 500px;
            height: 300px;
            background-color: yellow;
        }
        .a:hover{
             background-color: red;
            color: white;
            border: none;
            font-size: 70px;
            transition: 2.5s;
            transform: scale(0.7);
            border-radius: 60px;
            box-shadow: 10px 10px 10px blue;
            
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
 <button>Apply</button>
 <div class="a"></div>
</body>
</html>
